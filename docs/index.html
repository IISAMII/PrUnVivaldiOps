<style>
/* Layout idea: a ship's logbook. Four tabs: Today (what needs doing), Money (net worth, loans, sales), Bases (plan vs live), Log (snapshots). */
:root {
  --bg: #eff2f5; --surface: #ffffff; --ink: #14202b; --muted: #5a6b7b; --line: #d6dde4;
  --accent: #0a6a85; --accent-ink: #ffffff;
  --good: #1d8449; --warn: #a96a0c; --crit: #c0392b;
  --good-bg: #e2f1e8; --warn-bg: #f7ecd6; --crit-bg: #f8e0dd;
  --s-built: #1d8449; --s-approved: #0a6a85; --s-candidate: #7a5ec9; --s-idea: #7b8794; --s-dropped: #b0b8c0;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1318; --surface: #151d25; --ink: #e5ecf2; --muted: #8a9aaa; --line: #26333f;
    --accent: #4cc3e0; --accent-ink: #06222b;
    --good: #4cc38a; --warn: #e3a840; --crit: #ef6b5b;
    --good-bg: #14301f; --warn-bg: #33290f; --crit-bg: #3a1a17;
    --s-built: #4cc38a; --s-approved: #4cc3e0; --s-candidate: #a58cf0; --s-idea: #8a9aaa; --s-dropped: #5a6672;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1318; --surface: #151d25; --ink: #e5ecf2; --muted: #8a9aaa; --line: #26333f;
  --accent: #4cc3e0; --accent-ink: #06222b;
  --good: #4cc38a; --warn: #e3a840; --crit: #ef6b5b;
  --good-bg: #14301f; --warn-bg: #33290f; --crit-bg: #3a1a17;
  --s-built: #4cc38a; --s-approved: #4cc3e0; --s-candidate: #a58cf0; --s-idea: #8a9aaa; --s-dropped: #5a6672;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 18px 16px 48px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 32px; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 21px; margin: 0 0 8px; text-wrap: balance; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { font: 600 14px var(--font-body); padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink); background: var(--surface); cursor: pointer; }
.tab[aria-current="page"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.asof { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.tile .v { font: 500 24px var(--font-num); font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .s { color: var(--muted); font-size: 12.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; align-items: start; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.alerts { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.alert { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 8px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--muted); align-items: baseline; }
.alert.crit { border-left-color: var(--crit); background: var(--crit-bg); }
.alert.warn { border-left-color: var(--warn); background: var(--warn-bg); }
.alert.good { border-left-color: var(--good); }
.alert b { font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: .05em; }
.alert.crit b { color: var(--crit); } .alert.warn b { color: var(--warn); } .alert.good b { color: var(--good); }
.alert span { min-width: 0; }
.alert small { color: var(--muted); display: block; font-size: 12.5px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
td.n { font-family: var(--font-num); }
tr:last-child td { border-bottom: 0; }
.tablewrap { overflow-x: auto; }
.pos { color: var(--good); } .neg { color: var(--crit); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input, select, textarea { font: 400 14px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
input[type=number] { width: 150px; font-family: var(--font-num); }
textarea { width: 100%; }
button.act { font: 600 14px var(--font-body); padding: 7px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button.act.plain { background: var(--surface); color: var(--ink); border-color: var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px var(--font-body); padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 14px; }
.bar .sp { flex: 1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--stripe, var(--line)); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card h3 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; line-height: 1.1; }
.figs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 14px; margin: 0; }
.figs div { min-width: 0; }
.figs dt { color: var(--muted); font-size: 12px; }
.figs dd { margin: 0; font: 500 18px var(--font-num); font-variant-numeric: tabular-nums; }
.figs dd small { font: 400 12px var(--font-body); color: var(--muted); display: block; }
.desc { margin: 0; font-size: 13.5px; }
.live { border: 1px dashed var(--line); border-radius: 6px; padding: 8px 10px; display: grid; gap: 4px; font-size: 13.5px; }
.live .t { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.outs { display: grid; gap: 5px; }
.out { display: grid; grid-template-columns: 44px 1fr 92px; gap: 8px; align-items: center; font-size: 13px; }
.out b { font: 500 13px var(--font-num); }
.meter { height: 8px; background: var(--line); border-radius: 4px; position: relative; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--good); }
.meter i.warn { background: var(--warn); } .meter i.crit { background: var(--crit); }
.out span { text-align: right; color: var(--muted); }
.flags { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.flag { display: flex; gap: 6px; align-items: baseline; }
.flag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.flag.good::before { background: var(--good); } .flag.warn::before { background: var(--warn); } .flag.crit::before { background: var(--crit); }
.note { width: 100%; min-height: 84px; resize: vertical; }
.lbl { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
.pill { font: 600 12px var(--font-body); padding: 3px 9px; border-radius: 999px; color: var(--stripe); border: 1px solid var(--stripe); }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 12px; max-width: 80ch; }
.foot p { margin: 0 0 6px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--font-body); }
.chart .axis { stroke: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
details > summary { cursor: pointer; font-weight: 600; }
code, pre { font-family: var(--font-num); font-size: 12px; }
@media (prefers-reduced-motion: no-preference) { .meter i { transition: width .3s; } }

.field { display: grid; gap: 2px; }
.field input, .field select { width: 100%; }
input[type=number].sm, input[type=text].sm { width: 84px; }
.dtw { position: relative; display: block; width: 180px; } .dtw #leave { width: 100%; padding-right: 36px; } .dtw .cal { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 15px; line-height: 1; pointer-events: none; } .dtw #leavepick { position: absolute; right: 0; top: 0; bottom: 0; width: 34px; min-height: 0; padding: 0; border: 0; background: transparent; opacity: 0; cursor: pointer; overflow: hidden; } .dtw #leavepick::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; cursor: pointer; }
input[type=datetime-local] { font-family: var(--font-num); }
.load { display: grid; gap: 6px; margin: 8px 0; }
.load .l { display: grid; grid-template-columns: 56px 1fr 130px; gap: 8px; align-items: center; font-size: 13px; }
.load .l span:last-child { text-align: right; font-family: var(--font-num); }
.pk { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 6px; background: var(--surface); }
.pk textarea { font-family: var(--font-num); font-size: 11.5px; min-height: 90px; }
.split { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--line); }
.split i { display: block; height: 100%; }
.sS { background: var(--accent); } .sP { background: var(--good); } .sO { background: var(--muted); }
.muted { color: var(--muted); }
td.when { font-family: var(--font-body); }
td.txt { text-align: left; white-space: normal; min-width: 230px; }
.warnc { color: var(--warn); } .critc { color: var(--crit); }
h3.sm { font: 600 16px var(--font-body); margin: 12px 0 6px; }

.ships, .bcs { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); margin-bottom: 8px; }
.shipcard, .bc { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); display: grid; gap: 8px; min-width: 0; align-content: start; }
.bc.off { opacity: .55; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; font-size: 13.5px; }
.kv span { display: block; color: var(--muted); font-size: 12px; }
.kv b { font: 500 14px var(--font-num); display: block; }
.kv b.when { font-family: var(--font-body); font-weight: 500; }
.rw { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.rw:last-child { border-bottom: 0; }

.cols { margin-bottom: 14px; }
.alerts { margin-bottom: 4px; }
details.panel > summary { cursor: pointer; }

.bcard { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 12px 24px; overflow: hidden; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.bcard .big { display: grid; justify-items: start; } .bcard .big b { font-size: 22px; font-variant-numeric: tabular-nums; }
.bcard .spk { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bcard h3.sm { font: 600 15px var(--font-body); margin: 12px 0 4px; }
.bcard summary { cursor: pointer; font-weight: 600; } .bcard details[open] > summary { margin-bottom: 6px; }
.bcard .rw { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; } .bcard .rw .n { text-align: right; }
.bcard .kv { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.bcard .kv span.pos, .bcard .kv span.neg { display: inline; }
.slots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; } .slot { border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; font: 500 13px var(--font-num); background: var(--surface); white-space: nowrap; } .slot.empty { color: var(--muted); border-style: dashed; background: transparent; font-family: var(--font-body); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 5px; background: var(--line); color: var(--ink, inherit); margin-right: 6px; } .badge.crit { background: var(--crit); color: #fff; }
.nrow { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: flex-start; } .nrow:last-child { border-bottom: 0; } .nrow .n { white-space: nowrap; }
.badge.ex { background: var(--warn); color: #1a1405; } .badge.good { background: var(--good); color: #06210f; }
.runb { margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); } .runb:last-of-type { border-bottom: 0; }
.seg { border-top: 1px solid var(--line); padding: 6px 0; }
.seg summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; }
.segt { display: flex; flex-direction: column; }
</style>
