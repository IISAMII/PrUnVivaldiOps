name: snapshot
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/snapshot.yml'
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Take snapshot
        env:
          FIO_KEY: ${{ secrets.FIO_KEY || secrets.FIO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/snapshot.cjs
      - name: Save data
        run: |
          git config user.name "vivaldi-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 5; done
