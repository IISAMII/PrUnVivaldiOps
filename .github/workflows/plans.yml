name: plans
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plans:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe PRUNplanner
        env:
          PRUNPLANNER_KEY: ${{ secrets.PRUNPLANNER_KEY }}
        run: node scripts/plans_probe.cjs
