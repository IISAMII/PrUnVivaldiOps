name: auto
# Timer only: every 30 minutes it starts the snapshot workflow.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Start snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run snapshot.yml --repo "$GITHUB_REPOSITORY" --ref main
